name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - full_build

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Ruff check
        run: >-
          ruff check
          src/buildcompiler/api
          src/buildcompiler/planning
          src/buildcompiler/execution
          src/buildcompiler/stages
          src/buildcompiler/sbol
          src/buildcompiler/inventory
          src/buildcompiler/adapters
          src/buildcompiler/reporting
          src/buildcompiler/domain
          src/buildcompiler/protocols
          tests/conftest.py
          tests/unit
          tests/stages
          tests/integration
          tests/automation
      - name: Ruff format check
        run: >-
          ruff format --check
          src/buildcompiler/api
          src/buildcompiler/planning
          src/buildcompiler/execution
          src/buildcompiler/stages
          src/buildcompiler/sbol
          src/buildcompiler/inventory
          src/buildcompiler/adapters
          src/buildcompiler/reporting
          src/buildcompiler/domain
          src/buildcompiler/protocols
          tests/conftest.py
          tests/unit
          tests/stages
          tests/integration
          tests/automation
      - name: Core tests
        run: pytest tests/unit tests/stages tests/integration -q

  protocol-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MyersResearchGroup/PUDU
          ref: cdf7bde2128871c889fb25a4a0c168d5d8f0c1d3
          path: .reference/PUDU
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install simulator and test dependencies
        run: python -m pip install -e '.[test,simulation]'
      - name: Compare against pinned PUDU in the Opentrons simulator
        env:
          PUDU_REPOSITORY: ${{ github.workspace }}/.reference/PUDU
          BUILDCOMPILER_REQUIRE_EQUIVALENCE: "1"
        run: pytest tests/automation -q --basetemp=.equivalence-traces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-equivalence-traces
          path: .equivalence-traces
